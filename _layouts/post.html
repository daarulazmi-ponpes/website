<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.excerpt | strip_html | escape }}">
    <title>{{ page.title | escape }} | Pondok Pesantren Daarul Azmi</title>
    <link rel="icon" href="{{ '/assets/icons/logoDA.png' | relative_url }}" type="image/png">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="nav-wrap">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Daarul Azmi, beranda">
          <img src="{{ '/assets/icons/Header.png' | relative_url }}" alt="Pondok Pesantren Daarul Azmi">
        </a>
        <nav class="primary-nav" aria-label="Navigasi utama">
          <a href="{{ '/' | relative_url }}">Beranda</a>
          <a href="{{ '/berita.html' | relative_url }}">Berita</a>
          <a href="{{ '/galeri.html' | relative_url }}">Galeri</a>
        </nav>
      </div>
    </header>
    <main class="section-wrap news-section">
      <a class="text-link" href="{{ '/berita.html' | relative_url }}">← Semua berita</a>
      <article class="news-card" style="max-width: 820px; margin: 32px auto; padding: 24px;">
        <p class="eyebrow">{{ page.category | escape }} · {{ page.date | date: "%d-%m-%Y" }}</p>
        <h1>{{ page.title | escape }}</h1>
        {% if page.image %}
          <img src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title | escape }}" style="width: 100%; max-height: 480px; object-fit: cover;">
        {% endif %}
        <p>{{ page.excerpt | escape }}</p>
        <div class="article-body">{{ content }}</div>
      </article>
    </main>
    {% include ppdb-button.html %}
  </body>
</html>
