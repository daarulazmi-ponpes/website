backend:
  name: git-gateway
  branch: main
  identity_url: https://heartfelt-baklava-006ca7.netlify.app/.netlify/identity
  gateway_url: https://heartfelt-baklava-006ca7.netlify.app/.netlify/git

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Blog"
    folder: "content/blog"
    create: true
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Body", name: "body", widget: "markdown"}
